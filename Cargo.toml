[workspace]
resolver = "2"
members = [
  "crates/twilight-core",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["vivo6810"]
repository = "https://github.com/vivo6810/minecraftlauncher"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "v3", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
futures-util = "0.3"
walkdir = "2.5"
