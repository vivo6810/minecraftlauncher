name: Build & Release TwilightLauncher

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    name: Verify Rust Core & Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run twilight-core unit tests
        run: cargo test -p twilight-core

      - name: Install frontend dependencies & verify TypeScript build
        run: |
          npm install
          npm run build

  build-desktop:
    name: Build (${{ matrix.label }})
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (.exe / NSIS / .msi)
            artifact_name: TwilightLauncher-Windows-x64
            args: ""
          - platform: ubuntu-22.04
            label: Linux (.AppImage / .deb / .rpm)
            artifact_name: TwilightLauncher-Linux-x86_64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies (WebKit2GTK 4.1, AppImage, DEB, RPM)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri native bundles
        env:
          NO_STRIP: "true"
        run: npx tauri build ${{ matrix.args }}

      - name: Upload Linux AppImage, DEB & RPM workflow artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: TwilightLauncher-Linux-x86_64-bundles
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Windows NSIS, MSI & portable .exe workflow artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TwilightLauncher-Windows-x64-bundles
          path: |
            target/release/twilight-launcher.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Publish Linux AppImage, DEB & RPM to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "TwilightLauncher ${{ github.ref_name }}" \
              --notes "Ultra-lightweight monotone Minecraft: Java Edition launcher (Windows & Linux)."
          gh release upload "${{ github.ref_name }}" \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            --clobber

      - name: Publish Windows NSIS, MSI & portable .exe to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" `
              --title "TwilightLauncher ${{ github.ref_name }}" `
              --notes "Ultra-lightweight monotone Minecraft: Java Edition launcher (Windows & Linux)." 2>$null
          }
          if (Test-Path "target/release/twilight-launcher.exe") {
            Copy-Item "target/release/twilight-launcher.exe" "TwilightLauncher-portable-x64.exe" -Force
          }
          $files = @()
          $files += Get-ChildItem "TwilightLauncher-portable-x64.exe" -ErrorAction SilentlyContinue
          $files += Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $files += Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            gh release upload "${{ github.ref_name }}" $f.FullName --clobber
          }
