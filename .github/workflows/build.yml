name: Build & Release TwilightLauncher

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build-desktop:
    name: Build (${{ matrix.label }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-latest
            label: Windows (.exe / NSIS / .msi)
            artifact_name: TwilightLauncher-Windows-x64-bundles
          - platform: ubuntu-22.04
            label: Linux (.AppImage / .deb / .rpm)
            artifact_name: TwilightLauncher-Linux-x86_64-bundles

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-all-crates: true
          cache-on-failure: true

      - name: Cache Linux Tauri bundler tools
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-tools-${{ runner.os }}-v1

      - name: Install Linux system dependencies (WebKit2GTK 4.1, AppImage, DEB, RPM)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Run twilight-core unit tests
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test -p twilight-core

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Tauri native bundles
        env:
          NO_STRIP: "true"
        run: npx tauri build

      - name: Stage Linux AppImage, DEB & RPM bundles
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p release-staging
          cp target/release/bundle/appimage/*.AppImage release-staging/
          cp target/release/bundle/deb/*.deb release-staging/
          cp target/release/bundle/rpm/*.rpm release-staging/
          ls -lh release-staging/

      - name: Stage Windows portable .exe, NSIS & MSI bundles
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-staging | Out-Null
          Copy-Item "target/release/twilight-launcher.exe" "release-staging/TwilightLauncher-portable-x64.exe" -Force
          Copy-Item "target/release/bundle/nsis/*.exe" "release-staging/" -Force
          Copy-Item "target/release/bundle/msi/*.msi" "release-staging/" -Force
          Get-ChildItem release-staging | Format-Table Name, Length

      - name: Upload built bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-staging/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4

      - name: Download Linux & Windows release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          cd release-assets
          files=(*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found in release-assets/" >&2
            exit 1
          fi
          ls -lh -- "${files[@]}"
          sha256sum -- "${files[@]}" > SHA256SUMS.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" -- "${files[@]}" SHA256SUMS.txt --clobber
            gh release edit "${TAG}" --title "TwilightLauncher ${TAG}" --draft=false --latest
          else
            gh release create "${TAG}" -- "${files[@]}" SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "TwilightLauncher ${TAG}" \
              --generate-notes \
              --latest
          fi
